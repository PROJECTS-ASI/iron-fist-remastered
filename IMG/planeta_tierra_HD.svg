<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="oceano" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7fd8ff"/>
      <stop offset="35%" stop-color="#1f8fe0"/>
      <stop offset="70%" stop-color="#0b5aa8"/>
      <stop offset="100%" stop-color="#062f5c"/>
    </radialGradient>
    <radialGradient id="brillo" cx="32%" cy="28%" r="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombraBorde" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00131f" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="tierraVerde" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bc96f"/>
      <stop offset="100%" stop-color="#3f8f4a"/>
    </linearGradient>
    <linearGradient id="tierraArena" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8c179"/>
      <stop offset="100%" stop-color="#a98a4f"/>
    </linearGradient>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- halo exterior -->
  <circle cx="200" cy="200" r="196" fill="#3aa0ff" opacity="0.10"/>

  <!-- oceano base -->
  <circle cx="200" cy="200" r="180" fill="url(#oceano)"/>

  <!-- continentes -->
  <g filter="url(#suave)">
    <path d="M120 95 C150 80,190 85,205 110 C220 130,205 150,225 165 C245 180,235 210,205 215
             C180 220,165 200,145 205 C120 210,95 190,100 160 C103 135,100 110,120 95 Z"
          fill="url(#tierraVerde)"/>
    <path d="M235 120 C255 110,280 120,285 140 C290 158,275 165,270 180 C265 195,245 190,240 175
             C233 158,225 132,235 120 Z" fill="url(#tierraArena)"/>
    <path d="M110 235 C135 225,165 235,170 255 C175 275,150 290,125 285 C100 280,90 250,110 235 Z"
          fill="url(#tierraVerde)"/>
    <path d="M230 240 C255 232,285 245,288 265 C291 285,265 300,242 292 C220 285,210 250,230 240 Z"
          fill="url(#tierraArena)"/>
    <path d="M170 145 C185 140,198 150,196 163 C194 176,178 180,168 172 C159 165,158 150,170 145 Z"
          fill="url(#tierraVerde)" opacity="0.9"/>
  </g>

  <!-- nubes -->
  <g fill="#ffffff" opacity="0.35" filter="url(#suave)">
    <ellipse cx="150" cy="130" rx="38" ry="10" transform="rotate(-12 150 130)"/>
    <ellipse cx="255" cy="175" rx="46" ry="12" transform="rotate(8 255 175)"/>
    <ellipse cx="140" cy="270" rx="34" ry="9" transform="rotate(15 140 270)"/>
    <ellipse cx="230" cy="90" rx="30" ry="8" transform="rotate(-6 230 90)"/>
    <ellipse cx="180" cy="250" rx="40" ry="10" transform="rotate(-10 180 250)"/>
  </g>

  <!-- sombreado de esfera y brillo especular -->
  <circle cx="200" cy="200" r="180" fill="url(#sombraBorde)"/>
  <circle cx="200" cy="200" r="180" fill="url(#brillo)"/>

  <!-- borde fino -->
  <circle cx="200" cy="200" r="179" fill="none" stroke="#bfe9ff" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
